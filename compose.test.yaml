name: hyperf-crud-generator-tests
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: crud_test_only
      MYSQL_DATABASE: crud_test
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcrud_test_only"]
      interval: 5s
      timeout: 5s
      retries: 40
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: crud_test_only
      MARIADB_DATABASE: crud_test
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: crud_test_only
      POSTGRES_DB: crud_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "crud_test"]
      interval: 5s
      timeout: 5s
      retries: 40
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Crud_Test_Only_2026!"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Crud_Test_Only_2026!' -C -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  runner:
    build:
      context: .
      dockerfile: tests/Dockerfile
    working_dir: /workspace
    entrypoint: ["php", "vendor/phpunit/phpunit/phpunit"]
    volumes:
      - .:/workspace
    environment:
      CRUD_TEST_MYSQL_DSN: "mysql:host=mysql;dbname=crud_test"
      CRUD_TEST_MYSQL_USER: root
      CRUD_TEST_MYSQL_PASSWORD: crud_test_only
      CRUD_TEST_MARIADB_DSN: "mysql:host=mariadb;dbname=crud_test"
      CRUD_TEST_MARIADB_USER: root
      CRUD_TEST_MARIADB_PASSWORD: crud_test_only
      CRUD_TEST_PGSQL_DSN: "pgsql:host=postgres;dbname=crud_test"
      CRUD_TEST_PGSQL_USER: postgres
      CRUD_TEST_PGSQL_PASSWORD: crud_test_only
      CRUD_TEST_SQLSRV_DSN: "odbc:Driver=FreeTDS;Server=sqlserver;Port=1433;Database=master;TDS_Version=7.4"
      CRUD_TEST_SQLSRV_USER: sa
      CRUD_TEST_SQLSRV_PASSWORD: "Crud_Test_Only_2026!"
    depends_on:
      mysql: {condition: service_healthy}
      mariadb: {condition: service_healthy}
      postgres: {condition: service_healthy}
      sqlserver: {condition: service_healthy}
